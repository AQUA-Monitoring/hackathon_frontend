name: Build immutable Aqua frontend release

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: Server Ops build UUID receiving the CI result
        required: true
        type: string
      release_ref:
        description: Commit SHA or protected tag to build
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: aqua-frontend-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout requested release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 1

      - name: Resolve immutable SHA
        id: release
        env:
          REQUESTED_SHA: ${{ inputs.release_ref }}
        shell: bash
        run: |
          set -euo pipefail
          requested_sha=${REQUESTED_SHA,,}
          if [[ ! "$requested_sha" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo "Requested release must be a full commit SHA." >&2
            exit 1
          fi
          sha=$(git rev-parse HEAD)
          if [[ ! "$sha" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo "Resolved Git SHA is invalid." >&2
            exit 1
          fi
          test "$sha" = "$requested_sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Validate frontend
        run: npm ci && npm run quality

      - name: Configure Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate private registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend image
        env:
          REGISTRY: ghcr.io/aqua-monitoring
          SHA: ${{ steps.release.outputs.sha }}
          VITE_BASE_URL: ${{ vars.VITE_BASE_URL }}
          VITE_HLS_TARGET: ${{ vars.VITE_HLS_TARGET }}
          VITE_PROXY_TARGET: ${{ vars.VITE_PROXY_TARGET }}
          VITE_MAPBOX_API_KEY: ${{ secrets.VITE_MAPBOX_API_KEY }}
          VITE_PUBLIC_VAPID_KEY: ${{ vars.VITE_PUBLIC_VAPID_KEY }}
        run: |
          docker buildx build --pull --target production \
            --build-arg VITE_BASE_URL \
            --build-arg VITE_HLS_TARGET \
            --build-arg VITE_PROXY_TARGET \
            --build-arg VITE_MAPBOX_API_KEY \
            --build-arg VITE_PUBLIC_VAPID_KEY \
            --tag "$REGISTRY/aqua-frontend:$SHA" \
            --cache-from type=gha,scope=aqua-frontend \
            --cache-to type=gha,mode=max,scope=aqua-frontend \
            --sbom=true --provenance=mode=max --push \
            --metadata-file frontend-metadata.json .

      - name: Push image and record digest
        id: publish
        shell: bash
        env:
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          digest=$(jq -r '.["containerimage.digest"]' frontend-metadata.json)
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Published frontend digest is invalid." >&2
            exit 1
          fi
          echo "frontend_digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo "## Aqua frontend release"
            echo "Commit: $SHA"
            echo "Frontend: $digest"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report build result to Server Ops
        if: ${{ always() }}
        shell: bash
        env:
          BUILD_ID: ${{ inputs.build_id }}
          CALLBACK_URL: ${{ vars.SERVER_OPS_CALLBACK_URL }}
          CALLBACK_TOKEN: ${{ secrets.SERVER_OPS_CI_CALLBACK_TOKEN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.SERVER_OPS_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.SERVER_OPS_CF_ACCESS_CLIENT_SECRET }}
          JOB_STATUS: ${{ job.status }}
          RESOLVED_SHA: ${{ steps.release.outputs.sha }}
          FRONTEND_DIGEST: ${{ steps.publish.outputs.frontend_digest }}
        run: |
          set -euo pipefail

          if [[ ! "$BUILD_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "Server Ops build_id is not a valid UUID." >&2
            exit 1
          fi
          if [[ ! "$CALLBACK_URL" =~ ^https?://[^[:space:]?#]+(:[0-9]+)?(/[^[:space:]?#]*)?$ ]]; then
            echo "Server Ops callback URL is missing or invalid." >&2
            exit 1
          fi
          if [[ -z "$CALLBACK_TOKEN" ]]; then
            echo "Server Ops callback token is not configured." >&2
            exit 1
          fi
          test -n "$CF_ACCESS_CLIENT_ID"
          test -n "$CF_ACCESS_CLIENT_SECRET"

          callback_endpoint="${CALLBACK_URL%/}/internal/v1/ci/builds/$BUILD_ID/"
          if [[ "$JOB_STATUS" == "success" ]]; then
            if [[ ! "$RESOLVED_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
              echo "Successful build has no valid resolved Git SHA." >&2
              exit 1
            fi
            if [[ ! "$FRONTEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Successful build has no valid frontend digest." >&2
              exit 1
            fi
            payload="{\"status\":\"SUCCEEDED\",\"commit_sha\":\"$RESOLVED_SHA\",\"frontend_digest\":\"$FRONTEND_DIGEST\",\"workflow_run_id\":\"$GITHUB_RUN_ID\"}"
          else
            if [[ -n "$RESOLVED_SHA" && ! "$RESOLVED_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
              echo "Failed build reported an invalid resolved Git SHA." >&2
              exit 1
            fi
            if [[ -n "$RESOLVED_SHA" ]]; then
              payload="{\"status\":\"FAILED\",\"commit_sha\":\"$RESOLVED_SHA\",\"workflow_run_id\":\"$GITHUB_RUN_ID\"}"
            else
              payload="{\"status\":\"FAILED\",\"workflow_run_id\":\"$GITHUB_RUN_ID\"}"
            fi
          fi

          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 2 \
            --request POST \
            --header "Authorization: Bearer $CALLBACK_TOKEN" \
            --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$callback_endpoint"
